name: Build TrollStore IPA (iOS 15.8)

on:
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Build Configuration (Release or Debug for Dev Client)'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
  push:
    branches:
      - main

jobs:
  build-ipa:
    name: Build Unsigned IPA for TrollStore 2
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Expo Prebuild (Generate Native iOS Project)
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Verify iOS Deployment Target
        run: |
          echo "Checking minimum deployment target in Podfile and project..."
          grep -i "IPHONEOS_DEPLOYMENT_TARGET" ios/Podfile || true

      - name: Build Xcode Archive (Unsigned for TrollStore)
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          # Automatically detect main scheme
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync(0, 'utf-8'));
            const schemes = data.workspace?.schemes || [];
            const target = schemes.find(s => !s.includes('Pods') && !s.includes('Tests')) || schemes[0];
            console.log(target);
          ")
          echo "Using Workspace: $WORKSPACE"
          echo "Using Scheme: $SCHEME"
          
          CONFIG="${{ inputs.build_configuration || 'Release' }}"
          echo "Building configuration: $CONFIG"

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -archivePath "$RUNNER_TEMP/FocusPomodoro.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package App into TrollStore IPA
        run: |
          echo "Packaging Payload directory..."
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/FocusPomodoro.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/Payload/"
          
          # Inspect Info.plist
          APP_PATH=$(ls -d "$RUNNER_TEMP/Payload/"*.app | head -n 1)
          echo "Inspecting app bundle: $APP_PATH"
          plutil -p "$APP_PATH/Info.plist" | grep -i "MinimumOSVersion" || true
          
          cd "$RUNNER_TEMP"
          zip -r -y FocusPomodoro-TrollStore.ipa Payload
          echo "Created FocusPomodoro-TrollStore.ipa"
          ls -lh FocusPomodoro-TrollStore.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusPomodoro-TrollStore-IPA
          path: ${{ runner.temp }}/FocusPomodoro-TrollStore.ipa
          retention-days: 14
