name: Build TrollStore IPA (iOS 15.8)

on:
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Build Configuration (Release or Debug for Dev Client)'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
  push:
    branches:
      - main
      - develop

jobs:
  build-ipa:
    name: Build Unsigned IPA for TrollStore 2
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4