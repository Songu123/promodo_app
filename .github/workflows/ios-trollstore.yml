name: Build TrollStore IPA (iOS 15.8)

on:
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Build Configuration (Release or Debug for Dev Client)'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
  push:
    branches:
      - main
      - develop

jobs:
  build-ipa:
    name: Build Unsigned IPA for TrollStore 2
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Expo Prebuild (Generate Native iOS Project)
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Verify iOS Deployment Target
        run: |
          echo "Checking minimum deployment target in Podfile and project..."
          grep -i "IPHONEOS_DEPLOYMENT_TARGET" ios/Podfile || true

      - name: Build Xcode Archive (Unsigned for TrollStore)
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          XCODEPROJ=$(ls -d *.xcodeproj | head -n 1)
          APP_NAME=$(basename "$XCODEPROJ" .xcodeproj)
          
          echo "Using Workspace: $WORKSPACE"
          echo "Using Project: $XCODEPROJ"
          echo "App Name: $APP_NAME"
          
          # Detect main scheme from the main Xcode project (NOT from CocoaPods schemes)
          SCHEME=$(xcodebuild -project "$XCODEPROJ" -list -json | node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync(0, 'utf-8'));
            const schemes = data.project?.schemes || [];
            console.log(schemes[0] || '$APP_NAME');
          " | tail -n 1)
          
          echo "Resolved Main App Scheme: $SCHEME"
          
          CONFIG="${{ inputs.build_configuration }}"
          if [ -z "$CONFIG" ]; then
            CONFIG="Release"
          fi
          echo "Building configuration: $CONFIG"

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -archivePath "$RUNNER_TEMP/FocusPomodoro.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SKIP_INSTALL=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package App into TrollStore IPA
        run: |
          echo "Searching for compiled .app bundle..."
          
          # Priority 1: Check xcarchive Products/Applications
          APP_PATH=$(find "$RUNNER_TEMP/FocusPomodoro.xcarchive/Products/Applications" -name "*.app" -type d 2>/dev/null | head -n 1)
          
          # Priority 2: Fallback to DerivedData Build Products
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Not found in xcarchive Products/Applications. Searching DerivedData..."
            APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -name "*.app" -type d 2>/dev/null | grep -i -v "Pods" | head -n 1)
          fi
          
          # Priority 3: Fallback across RUNNER_TEMP
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Searching entire RUNNER_TEMP for .app..."
            APP_PATH=$(find "$RUNNER_TEMP" -name "*.app" -type d 2>/dev/null | grep -i -v "Pods" | head -n 1)
          fi

          echo "Selected app bundle: $APP_PATH"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Listing contents of RUNNER_TEMP for debugging:"
            find "$RUNNER_TEMP" -maxdepth 4 || true
            echo "ERROR: Could not locate .app bundle anywhere in $RUNNER_TEMP!"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          
          # Inspect Info.plist
          FINAL_APP=$(ls -d "$RUNNER_TEMP/Payload/"*.app | head -n 1)
          echo "Inspecting app bundle: $FINAL_APP"
          plutil -p "$FINAL_APP/Info.plist" | grep -i "MinimumOSVersion" || true
          
          cd "$RUNNER_TEMP"
          zip -r -y FocusPomodoro-TrollStore.ipa Payload
          echo "Created FocusPomodoro-TrollStore.ipa"
          ls -lh FocusPomodoro-TrollStore.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusPomodoro-TrollStore-IPA
          path: ${{ runner.temp }}/FocusPomodoro-TrollStore.ipa
          retention-days: 14
